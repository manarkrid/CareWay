server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Cette ligne est la clé : elle redirige tout vers index.html si le fichier n'existe pas
        try_files $uri $uri/ /index.html;
    }

    # Optionnel : gestion du cache pour les fichiers statiques
    location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
    }
}
